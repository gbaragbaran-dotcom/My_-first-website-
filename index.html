<!DOCTYPE html>
<html>
<head>
    <title>Noble's Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #222;
            text-align: center;
        }

        header {
            background: #111;
            color: white;
            padding: 30px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            font-size: 18px;
        }

        .content {
            padding: 40px 20px;
        }

        .card {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        button {
            background: #111;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        footer {
            margin-top: 40px;
            background: #111;
            color: white;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to Noble's Website</h1>
        <p>My first website</p>
    </header>

    <div class="content">

        <div class="card">
            <h2>About Me</h2>

            <p>
                Hello! My name is Noble.
                Welcome to my website.
            </p>

            <button>Contact Me</button>
        </div>

    </div>

    <footer>
        <p>© 2026 Noble. All rights reserved.</p>
    </footer>

</body>
</html>
